<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIREX — Тест соединения</title>
    <style>
        body {
            background: #000;
            color: #F0F0F0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #0A0A0A;
            border: 1px solid #2A2A2A;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            max-width: 400px;
        }
        h1 { font-size: 24px; margin: 0 0 8px 0; }
        p  { color: #8A8A8A; font-size: 14px; margin: 0; }
        .status { color: #00E78B; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>WIREX</h1>
        <p>Тестовая страница загружена <span class="status">успешно</span></p>
        <p id="time" style="margin-top:16px; font-family:monospace; font-size:12px;"></p>
    </div>
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString('ru-RU');
    </script>
</body>
</html>
